services:
  postgres:
    image: postgres:16-alpine
    container_name: psp-orchestrator-postgres
    environment:
      POSTGRES_DB: psp_orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psp_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: psp-orchestrator-api
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: psp_orchestrator
      TYPEORM_SYNCHRONIZE: "true"
      TYPEORM_LOGGING: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

